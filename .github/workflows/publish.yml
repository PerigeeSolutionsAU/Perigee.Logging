name: Build, Package and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for GitVersion to calculate versions accurately

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install GitVersion
        uses: gitversion/setup-gitversion@v3
        with:
          versionSpec: "6.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Display Calculated Version
        run: |
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "NuGetVersionV2: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Restore Dependencies
        run: dotnet restore Perigee.Logging/Perigee.Logging.csproj

      - name: Build Project
        run: dotnet build Perigee.Logging/Perigee.Logging.csproj -c Release --no-restore

      - name: Create NuGet Package
        run: |
          dotnet pack Perigee.Logging/Perigee.Logging.csproj \
            -c Release \
            --no-build \
            --output ./nupkg \
            /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Publish to MyGet
        if: ${{ env.MYGET_FEED_URL != '' && env.MYGET_API_KEY != '' }}
        env:
          MYGET_FEED_URL: ${{ secrets.MYGET_FEED_URL }}
          MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$MYGET_API_KEY" \
            --source "$MYGET_FEED_URL" \
            --skip-duplicate

      - name: Publish to NuGet.org
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate


